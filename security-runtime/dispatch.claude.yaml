# Docker mode with Claude Code as the Worker backend.
#
# The dispatcher resolves these references from its container environment. The
# compose file passes the values through from the host .env file.

server: "http://security-runtime-server:8000"

common_env:
  TSEC_SERVER_HOST: "security-runtime-server:8000"
  TSEC_AGENT_TOKEN: "xxx"

runtime:
  interval: 3
  max_workers: 2
  max_running_projects: 1
  max_project_workers: 2
  healthcheck_timeout: 30
  worker_healthcheck: "startup_only"
  execution: "container"
  prompt_group: "default"

tasks:
  bootstrap:
    timeout: 600
    conclude_timeout: 120
  reason:
    timeout: 300
    max_intents: 2
  explore:
    timeout: 600
    conclude_timeout: 120

container:
  image: "ghcr.io/oritera/security-runtime-worker:latest"
  network_mode: "bridge"
  completed_action: "stop"

workers:
  - name: "claudecode-worker"
    type: "claudecode"
    task_types: [bootstrap, reason, explore]
    max_running: 2
    priority: 0
    env:
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN}"
      # Required for third-party Anthropic-compatible model names.
      CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT: "1"
